<!-- Signature : petit coureur animé (casquette à l'envers, balle en main, baskets blanches)
     qui accélère puis freine, + nom. Inclus en bas de chaque page. -->
<style>

    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin: 48px auto 24px; padding-top: 18px;
    border-top: 1px solid #e3e6ea;
    color: #1f2a44; font-size: 0.9rem; flex-wrap: wrap;

  .hl-signature .hl-runner { width: 58px; height: 58px; flex: none; overflow: visible; }

  .hl-signature a { color: #1f2a44; text-decoration: none; border-bottom: 1px solid #c9ced6; }
  .hl-signature a:hover { border-bottom-color: #1f2a44; }
</style>

<div class="hl-signature">

      <g class="leg back" opacity="0.4">

        <path d="M15.6,46.1 L15.8,43.9 Q17.6,43.5 18.8,44.4 L21.3,45.2 Q21.8,46.1 21.1,46.3 Z" fill="#ffffff" stroke="currentColor" stroke-width="0.9"/>
        <line x1="15.9" y1="44.3" x2="15.8" y2="45.8" stroke="#C8443A" stroke-width="1.5"/>
        <line x1="16.2" y1="46.3" x2="21" y2="46.3" stroke="#C8443A" stroke-width="0.9"/>
      </g>
      <!-- tronc + tête -->
      <line x1="22.5" y1="13.5" x2="18" y2="27"/>
      <circle cx="24.6" cy="8.2" r="3.9" fill="currentColor" stroke="none"/>
      <!-- casquette à l'envers : calotte + visière vers l'arrière -->
      <path d="M20.6,7.5 A4.1,4.1 0 0 1 28.7,7.5 Z" fill="#C8443A" stroke="none"/>
      <line x1="21.2" y1="7.3" x2="16.8" y2="8.6" stroke="#C8443A" stroke-width="2"/>

        <line x1="15.9" y1="44.3" x2="15.8" y2="45.8" stroke="#C8443A" stroke-width="1.5"/>
        <line x1="16.2" y1="46.3" x2="21" y2="46.3" stroke="#C8443A" stroke-width="0.9"/>
      </g>
      <g class="arm front">
        <polyline points="21.6,15.5 18.5,21 23,23.5"/>
        <!-- balle de baseball -->

<script>
/* Cycle de 6 s : le coureur accélère (foulée plus ample et plus rapide,
   buste plus penché), puis freine jusqu'à un petit footing, et recommence. */
(function () {
  var svg = document.querySelector('.hl-runner');
  if (!svg) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var legF = svg.querySelector('.leg.front'), legB = svg.querySelector('.leg.back'),
      armF = svg.querySelector('.arm.front'), armB = svg.querySelector('.arm.back'),
      body = svg.querySelector('.body'),      ground = svg.querySelector('.ground');

  var CYCLE = 6, phase = 0, offset = 0, t0 = null, last = null;

  function frame(now) {
    if (t0 === null) { t0 = now; last = now; }
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var t = (now - t0) / 1000;

    var s = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / CYCLE);   // 0 = footing, 1 = sprint
    var speed = 0.35 + 1.65 * s * s;                           // fréquence de foulée
    phase += dt * 2 * Math.PI * 1.4 * speed;

    var amp = 16 + 22 * s;                                     // amplitude (degrés)
    var a = Math.sin(phase) * amp;
    legF.setAttribute('transform', 'rotate(' + a + ' 18 27)');
    legB.setAttribute('transform', 'rotate(' + (-a) + ' 18 27)');
    armF.setAttribute('transform', 'rotate(' + (-0.9 * a) + ' 21.6 15.5)');
    armB.setAttribute('transform', 'rotate(' + (0.9 * a) + ' 21.6 15.5)');

    var lean = 1 + 11 * s;                                     // inclinaison du buste
    var bounce = -Math.abs(Math.sin(phase)) * (0.5 + 1.5 * s);
    body.setAttribute('transform',
      'translate(0 ' + bounce + ') rotate(' + lean + ' 18 44)');

    offset = (offset + dt * 30 * speed) % 12;                  // le sol défile
    ground.setAttribute('stroke-dashoffset', offset);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
